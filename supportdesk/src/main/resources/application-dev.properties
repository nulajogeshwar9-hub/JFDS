# Development Profile Overrides
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# More verbose logging in dev
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Dev database
spring.datasource.url=jdbc:mysql://localhost:3306/supportdesk?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
