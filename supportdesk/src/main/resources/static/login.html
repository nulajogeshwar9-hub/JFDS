<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SupportDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .login-header {
            background: #1e293b;
            color: #ffffff;
            padding: 2.5rem 2rem 2rem;
            text-align: center;
        }
        .login-header i {
            font-size: 2.8rem;
            color: #3b82f6;
        }
        .login-body {
            padding: 2rem;
        }
        .demo-credentials {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div><i class="bi bi-headset"></i></div>
            <h3 class="fw-bold mt-2 mb-1">SupportDesk</h3>
            <p class="text-muted small mb-0">Multi-Domain Service Management Platform</p>
        </div>
        <div class="login-body">
            <!-- URL Parameter Alerts -->
            <div id="alertBox"></div>

            <form action="/login" method="POST" id="loginForm">
                <!-- CSRF Token injected via script or default form -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="username" class="form-control" placeholder="name@company.com" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label small fw-semibold text-secondary mb-0">Password</label>
                    </div>
                    <div class="input-group mt-1">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </div>
            </form>

            <div class="text-center small text-muted mb-3">
                Don't have an account? <a href="/register" class="fw-semibold text-primary">Register as Customer</a>
            </div>

            <!-- Demo Credentials Helper -->
            <div class="demo-credentials text-secondary">
                <div class="fw-bold mb-1 text-dark"><i class="bi bi-key me-1"></i>Demo Accounts:</div>
                <div><strong>Admin:</strong> admin@supportdesk.com / Admin@123</div>
                <div><strong>Agent:</strong> agent@supportdesk.com / Agent@123</div>
                <div><strong>Customer:</strong> customer@supportdesk.com / Customer@123</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check URL parameters for alerts
        const params = new URLSearchParams(window.location.search);
        const alertBox = document.getElementById('alertBox');

        if (params.has('error')) {
            alertBox.innerHTML = `
                <div class="alert alert-danger py-2 small d-flex align-items-center mb-3">
                    <i class="bi bi-exclamation-octagon-fill me-2 fs-6"></i>
                    <div>Invalid email or password. Please try again.</div>
                </div>`;
        } else if (params.has('logout')) {
            alertBox.innerHTML = `
                <div class="alert alert-success py-2 small d-flex align-items-center mb-3">
                    <i class="bi bi-check-circle-fill me-2 fs-6"></i>
                    <div>You have been logged out successfully.</div>
                </div>`;
        } else if (params.has('expired')) {
            alertBox.innerHTML = `
                <div class="alert alert-warning py-2 small d-flex align-items-center mb-3">
                    <i class="bi bi-clock-history me-2 fs-6"></i>
                    <div>Your session has expired. Please log in again.</div>
                </div>`;
        } else if (params.has('registered')) {
            alertBox.innerHTML = `
                <div class="alert alert-success py-2 small d-flex align-items-center mb-3">
                    <i class="bi bi-check-circle-fill me-2 fs-6"></i>
                    <div>Registration successful! You can now log in.</div>
                </div>`;
        }

        // Form action routing for Vercel vs Spring Boot
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            if (window.location.hostname.includes('vercel.app') || (window.location.port !== '8080' && window.location.port !== '')) {
                this.action = '/api/login';
            }
        });

        // Fetch CSRF token and append hidden input
        fetch('/login')
            .then(() => {
                const csrfToken = document.cookie.split('; ')
                    .find(row => row.startsWith('XSRF-TOKEN='))
                    ?.split('=')[1];
                if (csrfToken) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = '_csrf';
                    input.value = decodeURIComponent(csrfToken);
                    document.getElementById('loginForm').appendChild(input);
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
