<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Support Tickets - SupportDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i class="bi bi-headset text-primary me-2 fs-4"></i>
                <span class="brand-text">SupportDesk</span>
            </div>
            <div class="sidebar-user px-3 py-2 border-bottom border-secondary mb-3">
                <div class="fw-semibold text-white current-user-name">Customer</div>
                <div class="small text-muted current-user-role">CUSTOMER</div>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="/customer/dashboard" class="nav-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="/customer/tickets" class="nav-link active"><i class="bi bi-ticket-perforated me-2"></i> My Tickets</a>
                    </li>
                    <li class="nav-item">
                        <a href="/customer/tickets/new" class="nav-link"><i class="bi bi-plus-circle me-2"></i> Submit Ticket</a>
                    </li>
                    <li class="nav-item">
                        <a href="/customer/profile" class="nav-link"><i class="bi bi-person me-2"></i> Profile</a>
                    </li>
                    <li class="nav-item mt-4">
                        <a href="/logout" class="nav-link text-danger"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold mb-0">My Support Requests</h4>
                    <p class="text-muted small mb-0">Track and manage your submitted support tickets</p>
                </div>
                <a href="/customer/tickets/new" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i> Submit New Ticket
                </a>
            </header>

            <!-- Filters Bar -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <form id="filterForm" class="row g-2 align-items-center">
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                                <input type="text" id="filterQuery" class="form-control" placeholder="Search ticket # or subject...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <select id="filterStatus" class="form-select">
                                <option value="">All Statuses</option>
                                <option value="OPEN">Open</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="WAITING_FOR_CUSTOMER">Waiting For Customer</option>
                                <option value="RESOLVED">Resolved</option>
                                <option value="CLOSED">Closed</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="filterPriority" class="form-select">
                                <option value="">All Priorities</option>
                                <option value="URGENT">Urgent</option>
                                <option value="HIGH">High</option>
                                <option value="MEDIUM">Medium</option>
                                <option value="LOW">Low</option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel me-1"></i> Filter</button>
                            <button type="button" class="btn btn-outline-secondary" id="resetBtn"><i class="bi bi-arrow-clockwise"></i></button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tickets Table -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Ticket #</th>
                                    <th>Subject</th>
                                    <th>Category</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                    <th>Last Updated</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="ticketsTableBody">
                                <tr>
                                    <td colspan="8" class="text-center py-4 text-muted">
                                        <div class="spinner-border spinner-border-sm text-primary me-2"></div>
                                        Loading tickets...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white py-3 border-top d-flex justify-content-between align-items-center" id="paginationContainer"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let currentPage = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
            loadTickets();

            document.getElementById('filterForm').addEventListener('submit', (e) => {
                e.preventDefault();
                currentPage = 0;
                loadTickets();
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                document.getElementById('filterQuery').value = '';
                document.getElementById('filterStatus').value = '';
                document.getElementById('filterPriority').value = '';
                currentPage = 0;
                loadTickets();
            });
        });

        async function loadTickets(page = currentPage) {
            currentPage = page;
            const q = document.getElementById('filterQuery').value.trim();
            const status = document.getElementById('filterStatus').value;
            const priority = document.getElementById('filterPriority').value;

            let url = `/api/tickets?page=${page}&size=10&sortDirection=DESC`;
            if (q) url += `&query=${encodeURIComponent(q)}`;
            if (status) url += `&status=${status}`;
            if (priority) url += `&priority=${priority}`;

            try {
                const res = await API.get(url);
                if (!res) return;

                const tickets = res.content || [];
                const tbody = document.getElementById('ticketsTableBody');

                if (tickets.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" class="text-center py-5 text-muted">
                                <i class="bi bi-search fs-1 d-block mb-2 text-secondary"></i>
                                No support tickets match your filter criteria.
                            </td>
                        </tr>
                    `;
                    document.getElementById('paginationContainer').innerHTML = '';
                    return;
                }

                tbody.innerHTML = tickets.map(t => `
                    <tr>
                        <td class="fw-bold">
                            <a href="/customer/tickets/${t.id}" class="text-primary">${escapeHtml(t.ticketNumber)}</a>
                        </td>
                        <td>
                            <a href="/customer/tickets/${t.id}" class="text-dark fw-semibold text-decoration-none">
                                ${escapeHtml(t.subject)}
                            </a>
                        </td>
                        <td><span class="badge bg-light text-dark border">${escapeHtml(t.categoryName || 'General')}</span></td>
                        <td>${getPriorityBadge(t.priority)}</td>
                        <td>${getStatusBadge(t.status)}</td>
                        <td class="text-muted small">${formatDate(t.createdAt)}</td>
                        <td class="text-muted small">${timeAgo(t.updatedAt || t.createdAt)}</td>
                        <td class="text-end">
                            <a href="/customer/tickets/${t.id}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-chat-text me-1"></i> View
                            </a>
                        </td>
                    </tr>
                `).join('');

                renderPagination(res, 'paginationContainer', 'loadTickets');

            } catch (err) {
                console.error(err);
                document.getElementById('ticketsTableBody').innerHTML = `
                    <tr><td colspan="8" class="text-center py-4 text-danger">Error loading tickets.</td></tr>
                `;
            }
        }
    </script>
</body>
</html>
